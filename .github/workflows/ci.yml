name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lecurso
          POSTGRES_PASSWORD: lecurso
          POSTGRES_DB: lecurso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lecurso"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Credenciais descartáveis do Postgres do CI — nunca use dados de produção aqui.
      TEST_DATABASE_URL: postgresql://lecurso:lecurso@localhost:5432/lecurso_test
      E2E_DATABASE_URL: postgresql://lecurso:lecurso@localhost:5432/lecurso_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Criar banco de E2E
        run: PGPASSWORD=lecurso psql -h localhost -U lecurso -d lecurso_test -c "CREATE DATABASE lecurso_e2e"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
